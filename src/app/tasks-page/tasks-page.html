<h2>Liste des tâches</h2>
@if (tasks$ | async; as tasks) {
<ul>
  @for (t of tasks; track t.id) {
  <li>
    {{ t.title }}
    <button type="button" (click)="highlight(t)">Mettre en avant</button>
    <button type="button" (click)="deleteTask(t.id)">Supprimer</button>
  </li>
  }
</ul>
} @else {
<p>Chargement des tâches...</p>
}

<hr />

<h3>Actions</h3>
<div>
  <input
    type="text"
    #taskInput
    placeholder="Titre de la nouvelle tâche"
    (keyup.enter)="addTask(taskInput)"
  />
  <button (click)="addTask(taskInput)">Ajouter une tâche</button>
</div>

<!-- Zone d'injection du composant dynamique -->
<div #highlightContainer></div>
